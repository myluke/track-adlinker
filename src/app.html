<!doctype html>
<html lang="%site.lang%" data-theme="%site.theme%" style="--accent: %site.accent%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3L5MT2S20P"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-3L5MT2S20P');
    </script>
    <script>try{const t=localStorage.getItem('adlinker-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch{}</script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
